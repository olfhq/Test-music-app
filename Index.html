<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kinetic MIDI" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Kinetic Strings &amp; Drums — iPad PWA &amp; MIDI Edition</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, canvas {
      width: 100%;
      height: 100%;
      background-color: #0b0d10;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* Safe-area-aware floating HUD for iPad full-screen mode */
    .hud {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: calc(18px + env(safe-area-inset-left, 0px));
      right: calc(18px + env(safe-area-inset-right, 0px));
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 25;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #f8fafc;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .status-dot.unlocked {
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
    }

    .hint {
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: rgba(226, 232, 240, 0.45);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      pointer-events: auto;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(17, 20, 27, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 6px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(226, 232, 240, 0.48);
      padding-left: 6px;
      padding-right: 2px;
    }

    button, select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(226, 232, 240, 0.92);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.14s ease;
      outline: none;
      white-space: nowrap;
      touch-action: manipulation;
    }

    button:hover, select:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
    }

    button:active {
      transform: scale(0.96);
    }

    button.active-mode {
      background: rgba(168, 85, 247, 0.22);
      border-color: rgba(168, 85, 247, 0.6);
      color: #e9d5ff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
    }

    button.play-active {
      background: rgba(52, 211, 153, 0.2);
      border-color: rgba(52, 211, 153, 0.55);
      color: #6ee7b7;
    }

    button.primary {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.48);
      color: #38bdf8;
    }

    button.primary:hover {
      background: rgba(56, 189, 248, 0.28);
      color: #e0f2fe;
    }

    .bpm-badge {
      font-family: monospace;
      font-size: 12px;
      color: #f8fafc;
      min-width: 34px;
      text-align: center;
      font-weight: 600;
    }

    .bpm-step-btn {
      padding: 4px 9px;
      font-weight: 700;
    }

    select option {
      background: #11141a;
      color: #e2e8f0;
    }

    #toast {
      position: fixed;
      bottom: 33%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #e0f2fe;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.03em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 40;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    #toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 960px) {
      .hint { display: none; }
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="brand-block">
      <div class="title">
        <span class="status-dot" id="statusDot" title="Audio Status Indicator"></span>
        <span>Kinetic MIDI</span>
      </div>
      <div class="hint">MULTI-TOUCH STRINGS &amp; DRUMS • TAP SPACE FOR ORBS • TAP PIANO ROLL TO EDIT LOOP</div>
    </div>

    <div class="controls">
      <!-- Dynamic Guitar Tuning Selector -->
      <div class="control-group">
        <span class="group-label">Tuning</span>
        <select id="tuningSelect" title="Guitar String Tuning">
          <option value="standard">Standard (E2–E4)</option>
          <option value="amin_pent">A Minor Pentatonic</option>
          <option value="cmaj_pent">C Major Pentatonic</option>
          <option value="open_g">G Major / Open G</option>
          <option value="dadgad">DADGAD</option>
          <option value="drop_d">Drop D (D2–E4)</option>
        </select>
      </div>

      <!-- Loop Mode & Touch-Friendly BPM Stepper -->
      <div class="control-group">
        <button id="modeToggleBtn" class="active-mode">Mode: 4-Bar Loop</button>
        <button id="loopPlayBtn" class="play-active">⏸ Loop</button>
        <span class="group-label">BPM</span>
        <button id="bpmDownBtn" class="bpm-step-btn" title="Decrease BPM">−</button>
        <span id="bpmDisplay" class="bpm-badge">120</span>
        <button id="bpmUpBtn" class="bpm-step-btn" title="Increase BPM">+</button>
      </div>

      <!-- Kinetic Orb Controls -->
      <div class="control-group">
        <button id="spawnBtn">+ Orb</button>
        <button id="clearOrbsBtn">Clear Orbs</button>
      </div>

      <!-- Web MIDI Out & .mid File Export -->
      <div class="control-group">
        <select id="midiOutSelect" title="Web MIDI Output">
          <option value="">MIDI Out: Internal Synth</option>
        </select>
        <button id="clearMidiBtn">Clear Roll</button>
        <button id="exportMidiBtn" class="primary">Export .mid (0)</button>
      </div>
    </div>
  </div>

  <div id="toast">Ready</div>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const statusDot = document.getElementById('statusDot');
    const tuningSelect = document.getElementById('tuningSelect');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const loopPlayBtn = document.getElementById('loopPlayBtn');
    const bpmDownBtn = document.getElementById('bpmDownBtn');
    const bpmUpBtn = document.getElementById('bpmUpBtn');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const exportBtn = document.getElementById('exportMidiBtn');
    const midiOutSelect = document.getElementById('midiOutSelect');
    const toastEl = document.getElementById('toast');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1650);
    }

    function midiToFreq(midi) {
      return +(440 * Math.pow(2, (midi - 69) / 12)).toFixed(2);
    }

    // --- ROBUST iOS / iPadOS WEB AUDIO API UNLOCK ---
    let audioCtx = null;
    let audioUnlocked = false;
    let masterGain = null;

    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(0.9, audioCtx.currentTime);
          masterGain.connect(audioCtx.destination);
        }

        if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
          audioCtx.resume();
        }

        if (!audioUnlocked && audioCtx) {
          // Play a 1-sample silent buffer to immediately unlock iOS/iPadOS WebKit audio hardware
          const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
          const source = audioCtx.createBufferSource();
          source.buffer = silentBuffer;
          source.connect(audioCtx.destination);
          if (source.start) source.start(0);
          else if (source.noteOn) source.noteOn(0);

          if (audioCtx.state === 'running') {
            audioUnlocked = true;
            statusDot.classList.add('unlocked');
          } else {
            audioCtx.onstatechange = () => {
              if (audioCtx.state === 'running') {
                audioUnlocked = true;
                statusDot.classList.add('unlocked');
              }
            };
          }
        }
      } catch (err) {
        // Ignore transient audio context errors
      }
    }

    // Attach global first-gesture unlock listeners for iPad Safari
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    window.addEventListener('pointerdown', unlockAudio, { passive: true });

    function playGuitarNote(freq, velocityNorm = 0.85) {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq, now);
      osc2.detune.setValueAtTime(4.5, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * (3.2 + velocityNorm * 4.2), now);
      filter.frequency.exponentialRampToValueAtTime(freq * 1.15, now + 1.15);

      const peakGain = 0.11 + velocityNorm * 0.19;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + 0.009);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.6);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain || audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.65);
      osc2.stop(now + 1.65);
    }

    function playDrumSound(type, velocityNorm = 0.9) {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const dest = masterGain || audioCtx.destination;

      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.14);

        gain.gain.setValueAtTime(0.55 * velocityNorm + 0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        osc.connect(gain);
        gain.connect(dest);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'snare') {
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.18);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(720, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.32 * velocityNorm, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(dest);
        noise.start(now);

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(185, now);
        oscGain.gain.setValueAtTime(0.24 * velocityNorm, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.connect(oscGain);
        oscGain.connect(dest);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hihat') {
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.075);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(6600, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25 * velocityNorm, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(dest);
        noise.start(now);
      }
    }

    // Notes ordered Top Lane (0, highest pitch) to Bottom Guitar Lane (5, lowest pitch)
    const TUNING_PRESETS = {
      standard: {
        label: 'Standard (E2 A2 D3 G3 B3 E4)',
        notes: [
          { name: 'E4', midi: 64 },
          { name: 'B3', midi: 59 },
          { name: 'G3', midi: 55 },
          { name: 'D3', midi: 50 },
          { name: 'A2', midi: 45 },
          { name: 'E2', midi: 40 }
        ]
      },
      amin_pent: {
        label: 'A Minor Pentatonic (A2 C3 D3 E3 G3 A3)',
        notes: [
          { name: 'A3', midi: 57 },
          { name: 'G3', midi: 55 },
          { name: 'E3', midi: 52 },
          { name: 'D3', midi: 50 },
          { name: 'C3', midi: 48 },
          { name: 'A2', midi: 45 }
        ]
      },
      cmaj_pent: {
        label: 'C Major Pentatonic (C3 D3 E3 G3 A3 C4)',
        notes: [
          { name: 'C4', midi: 60 },
          { name: 'A3', midi: 57 },
          { name: 'G3', midi: 55 },
          { name: 'E3', midi: 52 },
          { name: 'D3', midi: 50 },
          { name: 'C3', midi: 48 }
        ]
      },
      open_g: {
        label: 'G Major / Open G (D2 G2 D3 G3 B3 D4)',
        notes: [
          { name: 'D4', midi: 62 },
          { name: 'B3', midi: 59 },
          { name: 'G3', midi: 55 },
          { name: 'D3', midi: 50 },
          { name: 'G2', midi: 43 },
          { name: 'D2', midi: 38 }
        ]
      },
      dadgad: {
        label: 'DADGAD (D2 A2 D3 G3 A3 D4)',
        notes: [
          { name: 'D4', midi: 62 },
          { name: 'A3', midi: 57 },
          { name: 'G3', midi: 55 },
          { name: 'D3', midi: 50 },
          { name: 'A2', midi: 45 },
          { name: 'D2', midi: 38 }
        ]
      },
      drop_d: {
        label: 'Drop D (D2 A2 D3 G3 B3 E4)',
        notes: [
          { name: 'E4', midi: 64 },
          { name: 'B3', midi: 59 },
          { name: 'G3', midi: 55 },
          { name: 'D3', midi: 50 },
          { name: 'A2', midi: 45 },
          { name: 'D2', midi: 38 }
        ]
      }
    };

    const STRING_COLORS = ['#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#c084fc', '#e879f9'];

    const DRUM_CONFIGS = [
      { id: 'hihat', label: 'HH', fullLabel: 'HI-HAT', midi: 42, shape: 'triangle', color: '#fbbf24', lane: 6, r: 40, yRatio: 0.16 },
      { id: 'snare', label: 'SD', fullLabel: 'SNARE',  midi: 38, shape: 'diamond',  color: '#f87171', lane: 7, r: 46, yRatio: 0.50 },
      { id: 'kick',  label: 'BD', fullLabel: 'KICK',   midi: 36, shape: 'hexagon',  color: '#34d399', lane: 8, r: 54, yRatio: 0.84 }
    ];

    // --- WEB MIDI API SETUP ---
    let midiAccess = null;
    let activeMidiOutput = null;

    if (navigator.requestMIDIAccess) {
      navigator.requestMIDIAccess().then((access) => {
        midiAccess = access;
        updateMidiOutputs();
        midiAccess.onstatechange = updateMidiOutputs;
      }).catch(() => {});
    }

    function updateMidiOutputs() {
      if (!midiAccess) return;
      const currentVal = midiOutSelect.value;
      midiOutSelect.innerHTML = '<option value="">MIDI Out: Internal Synth</option>';
      for (const output of midiAccess.outputs.values()) {
        const opt = document.createElement('option');
        opt.value = output.id;
        opt.textContent = `MIDI Out: ${output.name}`;
        midiOutSelect.appendChild(opt);
      }
      midiOutSelect.value = currentVal;
    }

    midiOutSelect.addEventListener('change', () => {
      if (!midiAccess || !midiOutSelect.value) {
        activeMidiOutput = null;
        showToast('MIDI Out: Internal Synth');
        return;
      }
      activeMidiOutput = midiAccess.outputs.get(midiOutSelect.value) || null;
      if (activeMidiOutput) showToast(`MIDI Out: ${activeMidiOutput.name}`);
    });

    function sendLiveMidiMessage(midiNote, velocity, channel, durationMs) {
      if (!activeMidiOutput) return;
      try {
        const statusOn = 0x90 | (channel & 0x0f);
        const statusOff = 0x80 | (channel & 0x0f);
        activeMidiOutput.send([statusOn, midiNote & 0x7f, velocity & 0x7f]);
        setTimeout(() => {
          if (activeMidiOutput) {
            activeMidiOutput.send([statusOff, midiNote & 0x7f, 0]);
          }
        }, durationMs);
      } catch (e) {}
    }

    let currentTuningKey = 'standard';
    let strings = [];
    let drums = [];
    let allLanes = [];
    let movers = [];
    let ripples = [];
    let touchTrails = [];

    // Piano Roll & Loop State
    let rollMode = 'loop'; // 'loop' | 'scroll'
    let loopPlaying = true;
    let bpm = 120;
    let loopProgress = 0; // 0.0 -> 1.0 across 4 bars (16 beats)
    let lastFrameTime = performance.now();

    let scrollMidiBlocks = [];
    let loopNotes = [];
    let scrollRecordedEvents = [];
    let sessionStartTime = null;

    function rebuildLanesMeta() {
      allLanes = [
        ...strings.map(s => ({
          label: `${s.name} (${s.midi})`,
          color: s.color,
          lane: s.lane,
          midi: s.midi,
          isDrum: false
        })),
        ...drums.map(d => ({
          label: `${d.label} (${d.midi})`,
          color: d.color,
          lane: d.lane,
          midi: d.midi,
          isDrum: true
        }))
      ];
    }

    function getPianoRollGeometry() {
      const rollTop = Math.floor(height * 0.68);
      const rollBottom = height - 16;
      const rollHeight = rollBottom - rollTop;
      const laneCount = 9;
      const laneH = rollHeight / laneCount;
      const keyWidth = 84;
      const rollLeft = 20 + keyWidth;
      const rollRight = width - 20;
      const gridWidth = rollRight - rollLeft;
      return { rollTop, rollBottom, rollHeight, laneCount, laneH, keyWidth, rollLeft, rollRight, gridWidth };
    }

    function setupLayout() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const playAreaTop = 86;
      const playAreaBottom = height * 0.60;
      const stringSpan = playAreaBottom - playAreaTop;

      const preset = TUNING_PRESETS[currentTuningKey];

      strings = preset.notes.map((noteDef, idx) => {
        const y = playAreaTop + (stringSpan / (preset.notes.length - 1)) * idx;
        const prev = strings[idx];
        return {
          name: noteDef.name,
          midi: noteDef.midi,
          freq: midiToFreq(noteDef.midi),
          color: STRING_COLORS[idx],
          lane: idx,
          x1: width * 0.06,
          x2: width * 0.64,
          y,
          pluckX: prev ? prev.pluckX : width * 0.35,
          amp: prev ? prev.amp : 0,
          phase: prev ? prev.phase : 0
        };
      });

      const drumX = width * 0.82;
      drums = DRUM_CONFIGS.map((cfg, idx) => {
        const prev = drums[idx];
        return {
          ...cfg,
          x: drumX,
          y: playAreaTop + stringSpan * cfg.yRatio,
          pulse: prev ? prev.pulse : 0
        };
      });

      rebuildLanesMeta();
    }

    setupLayout();
    window.addEventListener('resize', setupLayout);

    function applyTuning(tuningKey, announce = false) {
      currentTuningKey = tuningKey;
      const preset = TUNING_PRESETS[tuningKey] || TUNING_PRESETS.standard;

      strings.forEach((s, idx) => {
        const noteDef = preset.notes[idx];
        s.name = noteDef.name;
        s.midi = noteDef.midi;
        s.freq = midiToFreq(noteDef.midi);
        if (announce) {
          s.amp = 12;
          s.phase = idx * 0.5;
        }
      });

      for (const ln of loopNotes) {
        if (!ln.isDrum && strings[ln.lane]) {
          ln.midi = strings[ln.lane].midi;
        }
      }

      rebuildLanesMeta();

      if (announce) {
        unlockAudio();
        strings.slice().reverse().forEach((s, i) => {
          setTimeout(() => {
            playGuitarNote(s.freq, 0.55);
            s.amp = 15;
          }, i * 42);
        });
        showToast(preset.label);
      }
    }

    function getLoopDurationMs() {
      // 4 bars of 4/4 = 16 quarter-note beats
      return (60000 / bpm) * 16;
    }

    function updateExportCounter() {
      const count = rollMode === 'loop' ? loopNotes.length : scrollRecordedEvents.length;
      exportBtn.textContent = `Export .mid (${count})`;
    }

    function fireInstrumentLane(lane, velocity = 100, triggerX = null, recordToRoll = true) {
      const velNorm = Math.min(1, Math.max(0.25, velocity / 127));

      if (lane < 6) {
        const s = strings[lane];
        if (!s) return;
        playGuitarNote(s.freq, velNorm);
        s.amp = 17 + velNorm * 13;
        s.phase = 0;
        const rx = triggerX !== null ? triggerX : (s.x1 + s.x2) * 0.5;
        s.pluckX = Math.min(s.x2 - 20, Math.max(s.x1 + 20, rx));

        ripples.push({ x: rx, y: s.y, r: 4, maxR: 36, color: s.color, alpha: 0.92 });
        sendLiveMidiMessage(s.midi, velocity, 0, 420);

        if (recordToRoll) {
          recordMidiEvent({
            lane: s.lane,
            midi: s.midi,
            velocity,
            durationMs: 420,
            channel: 0,
            isDrum: false,
            color: s.color
          });
        }
      } else {
        const d = drums[lane - 6];
        if (!d) return;
        playDrumSound(d.id, velNorm);
        d.pulse = 1;
        ripples.push({ x: d.x, y: d.y, r: d.r * 0.78, maxR: d.r * 1.85, color: d.color, alpha: 0.92 });
        sendLiveMidiMessage(d.midi, velocity, 9, 160);

        if (recordToRoll) {
          recordMidiEvent({
            lane: d.lane,
            midi: d.midi,
            velocity,
            durationMs: 160,
            channel: 9,
            isDrum: true,
            color: d.color
          });
        }
      }
    }

    function recordMidiEvent({ lane, midi, velocity, durationMs, channel, isDrum, color }) {
      const now = performance.now();
      if (sessionStartTime === null) sessionStartTime = now;

      scrollRecordedEvents.push({
        midi,
        velocity,
        startMs: now - sessionStartTime,
        durationMs,
        channel
      });

      const { rollRight } = getPianoRollGeometry();
      const scrollPlayheadX = rollRight - 48;
      const blockW = isDrum ? 18 : Math.max(26, (durationMs / 1000) * 75);
      scrollMidiBlocks.push({
        x: scrollPlayheadX - blockW,
        w: blockW,
        lane,
        midi,
        velocity,
        color,
        isDrum,
        alpha: 1
      });

      if (rollMode === 'loop') {
        const loopDurMs = getLoopDurationMs();
        const normDur = isDrum ? (1 / 64) : Math.min(0.12, Math.max(1 / 32, durationMs / loopDurMs));

        const duplicate = loopNotes.find(
          n => n.lane === lane && Math.abs(n.normStart - loopProgress) < 0.008
        );
        if (!duplicate) {
          loopNotes.push({
            id: Math.random().toString(36).slice(2),
            lane,
            normStart: loopProgress,
            normDur,
            velocity,
            midi,
            channel,
            isDrum,
            color,
            flash: 1.0
          });
        }
      }

      updateExportCounter();
    }

    function pluckString(s, triggerX, speedNorm = 0.85) {
      const velocity = Math.min(127, Math.max(48, Math.round(speedNorm * 118)));
      fireInstrumentLane(s.lane, velocity, triggerX, true);
    }

    function hitDrum(d, speedNorm = 0.9) {
      const velocity = Math.min(127, Math.max(58, Math.round(speedNorm * 122)));
      fireInstrumentLane(d.lane, velocity, d.x, true);
    }

    // --- KINETIC ORBS (MOTION TRIGGERS) ---
    function spawnMover(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.6 + Math.random() * 2.2;
      movers.push({
        x: x ?? (width * 0.35 + (Math.random() - 0.5) * 200),
        y: y ?? (height * 0.30 + (Math.random() - 0.5) * 130),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 8.5,
        drumCooldowns: {}
      });
    }

    // Spawn 2 initial kinetic orbs
    spawnMover(width * 0.30, height * 0.24);
    spawnMover(width * 0.77, height * 0.28);

    const activePointers = new Map();

    function checkLineCross(yLine, y1, y2, x, xMin, xMax) {
      if (x < xMin || x > xMax) return false;
      return (y1 <= yLine && y2 >= yLine) || (y1 >= yLine && y2 <= yLine);
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      unlockAudio();

      try {
        canvas.setPointerCapture(e.pointerId);
      } catch (err) {}

      const px = e.clientX;
      const py = e.clientY;

      activePointers.set(e.pointerId, {
        id: e.pointerId,
        x: px,
        y: py,
        lastX: px,
        lastY: py
      });

      touchTrails.push({ x: px, y: py, r: 10, alpha: 0.65 });

      const { rollTop, rollBottom, laneH, rollLeft, rollRight, gridWidth } = getPianoRollGeometry();

      // 1. Check if tapping inside the Bottom Piano Roll Dock
      if (py >= rollTop && py <= rollBottom) {
        const lane = Math.floor((py - rollTop) / laneH);
        if (lane >= 0 && lane < 9) {
          // Tapping left lane header auditions that string/drum
          if (px >= 20 && px < rollLeft) {
            fireInstrumentLane(lane, 108, null, false);
            return;
          }

          // Tapping inside the grid in 4-Bar Loop mode toggles a step note
          if (rollMode === 'loop' && px >= rollLeft && px <= rollRight) {
            const clickNorm = (px - rollLeft) / gridWidth;

            const existingIdx = loopNotes.findIndex(n => {
              if (n.lane !== lane) return false;
              const hitW = Math.max(n.normDur, 0.018);
              return clickNorm >= n.normStart - 0.008 && clickNorm <= n.normStart + hitW + 0.008;
            });

            if (existingIdx !== -1) {
              loopNotes.splice(existingIdx, 1);
              updateExportCounter();
              return;
            }

            const step64 = Math.floor(clickNorm * 64) / 64;
            const isDrum = lane >= 6;
            const laneMeta = allLanes[lane];

            loopNotes.push({
              id: Math.random().toString(36).slice(2),
              lane,
              normStart: step64,
              normDur: isDrum ? (1 / 64) : (1 / 16),
              velocity: 108,
              midi: laneMeta.midi,
              channel: isDrum ? 9 : 0,
              isDrum,
              color: laneMeta.color,
              flash: 1.0
            });

            fireInstrumentLane(lane, 108, null, false);
            updateExportCounter();
            return;
          }
        }
        return;
      }

      // 2. Check if tapping a Drum Pad directly
      for (const d of drums) {
        if (Math.hypot(px - d.x, py - d.y) <= d.r + 10) {
          hitDrum(d, 0.95);
          return;
        }
      }

      // 3. Check if tapping directly on a Guitar String
      for (const s of strings) {
        if (px >= s.x1 && px <= s.x2 && Math.abs(py - s.y) < 16) {
          pluckString(s, px, 0.9);
          return;
        }
      }

      // 4. Tapping empty upper arena spawns a kinetic orb
      if (py < rollTop - 14 && py > 68) {
        spawnMover(px, py);
      }
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
      e.preventDefault();
      const ptr = activePointers.get(e.pointerId);
      if (!ptr) return;

      ptr.lastX = ptr.x;
      ptr.lastY = ptr.y;
      ptr.x = e.clientX;
      ptr.y = e.clientY;

      const moveDist = Math.hypot(ptr.x - ptr.lastX, ptr.y - ptr.lastY);
      if (moveDist > 3) {
        touchTrails.push({ x: ptr.x, y: ptr.y, r: 6, alpha: 0.45 });
      }

      const speedNorm = Math.min(1, Math.max(0.5, moveDist / 34));

      // Multi-touch strumming across strings
      for (const s of strings) {
        if (checkLineCross(s.y, ptr.lastY, ptr.y, ptr.x, s.x1, s.x2)) {
          pluckString(s, ptr.x, speedNorm);
        }
      }

      // Multi-touch swiping into drum shapes
      for (const d of drums) {
        const prevDist = Math.hypot(ptr.lastX - d.x, ptr.lastY - d.y);
        const currDist = Math.hypot(ptr.x - d.x, ptr.y - d.y);
        if (prevDist > d.r && currDist <= d.r) {
          hitDrum(d, speedNorm);
        }
      }
    }, { passive: false });

    function removePointer(e) {
      activePointers.delete(e.pointerId);
    }

    canvas.addEventListener('pointerup', removePointer);
    canvas.addEventListener('pointercancel', removePointer);
    canvas.addEventListener('lostpointercapture', removePointer);

    function writeVarLen(value) {
      let buffer = value & 0x7f;
      const bytes = [];
      while ((value >>= 7)) {
        buffer <<= 8;
        buffer |= (value & 0x7f) | 0x80;
      }
      while (true) {
        bytes.push(buffer & 0xff);
        if (buffer & 0x80) buffer >>= 8;
        else break;
      }
      return bytes;
    }

    function exportStandardMidiFile() {
      const loopDurMs = getLoopDurationMs();
      let eventsToExport = [];

      if (rollMode === 'loop' && loopNotes.length > 0) {
        eventsToExport = loopNotes.map(n => ({
          midi: n.midi,
          velocity: n.velocity,
          startMs: n.normStart * loopDurMs,
          durationMs: Math.max(120, n.normDur * loopDurMs),
          channel: n.channel
        }));
      } else if (scrollRecordedEvents.length > 0) {
        eventsToExport = scrollRecordedEvents;
      }

      if (eventsToExport.length === 0) {
        showToast('Strum strings or tap drums before exporting .mid');
        return;
      }

      const ppq = 480;
      const exportBpm = bpm;
      const msToTicks = (ms) => Math.max(0, Math.round(ms * (ppq * (exportBpm / 60000))));

      const rawMessages = [];
      for (const ev of eventsToExport) {
        const onTick = msToTicks(ev.startMs);
        const offTick = msToTicks(ev.startMs + ev.durationMs);
        rawMessages.push({
          tick: onTick,
          bytes: [0x90 | (ev.channel & 0x0f), ev.midi & 0x7f, ev.velocity & 0x7f]
        });
        rawMessages.push({
          tick: offTick,
          bytes: [0x80 | (ev.channel & 0x0f), ev.midi & 0x7f, 0x00]
        });
      }

      rawMessages.sort((a, b) => a.tick - b.tick);

      const trackBytes = [];
      // Tempo Meta Event
      const usPerBeat = Math.round(60000000 / exportBpm);
      trackBytes.push(
        0x00, 0xff, 0x51, 0x03,
        (usPerBeat >> 16) & 0xff,
        (usPerBeat >> 8) & 0xff,
        usPerBeat & 0xff
      );
      // Program Change Ch 1 -> Acoustic Guitar (Steel) GM #25
      trackBytes.push(0x00, 0xc0, 25);

      let lastTick = 0;
      for (const msg of rawMessages) {
        const delta = Math.max(0, msg.tick - lastTick);
        lastTick = msg.tick;
        trackBytes.push(...writeVarLen(delta), ...msg.bytes);
      }

      // End of Track
      trackBytes.push(0x00, 0xff, 0x2f, 0x00);

      const header = [
        0x4d, 0x54, 0x68, 0x64,
        0x00, 0x00, 0x00, 0x06,
        0x00, 0x00,
        0x00, 0x01,
        (ppq >> 8) & 0xff, ppq & 0xff
      ];

      const len = trackBytes.length;
      const trackHeader = [
        0x4d, 0x54, 0x72, 0x6b,
        (len >> 24) & 0xff,
        (len >> 16) & 0xff,
        (len >> 8) & 0xff,
        len & 0xff
      ];

      const midiFile = new Uint8Array([...header, ...trackHeader, ...trackBytes]);
      const blob = new Blob([midiFile], { type: 'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kinetic-${currentTuningKey}-${exportBpm}bpm.mid`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast(`Exported ${eventsToExport.length} MIDI notes (.mid)`);
    }

    tuningSelect.addEventListener('change', (e) => {
      applyTuning(e.target.value, true);
    });

    modeToggleBtn.addEventListener('click', () => {
      unlockAudio();
      if (rollMode === 'loop') {
        rollMode = 'scroll';
        modeToggleBtn.textContent = 'Mode: Live Scroll';
        modeToggleBtn.classList.remove('active-mode');
        showToast('Mode: Live Scrolling Piano Roll');
      } else {
        rollMode = 'loop';
        modeToggleBtn.textContent = 'Mode: 4-Bar Loop';
        modeToggleBtn.classList.add('active-mode');
        showToast('Mode: 4-Bar Loop (Tap grid to toggle step notes)');
      }
      updateExportCounter();
    });

    loopPlayBtn.addEventListener('click', () => {
      unlockAudio();
      loopPlaying = !loopPlaying;
      if (loopPlaying) {
        loopPlayBtn.textContent = '⏸ Loop';
        loopPlayBtn.classList.add('play-active');
      } else {
        loopPlayBtn.textContent = '▶ Loop';
        loopPlayBtn.classList.remove('play-active');
      }
    });

    function setBpm(newBpm) {
      bpm = Math.min(180, Math.max(60, newBpm));
      bpmDisplay.textContent = bpm;
      showToast(`Tempo: ${bpm} BPM`);
    }

    bpmDownBtn.addEventListener('click', () => setBpm(bpm - 5));
    bpmUpBtn.addEventListener('click', () => setBpm(bpm + 5));

    document.getElementById('spawnBtn').addEventListener('click', () => {
      unlockAudio();
      spawnMover();
    });

    document.getElementById('clearOrbsBtn').addEventListener('click', () => {
      movers = [];
      showToast('Cleared kinetic orbs');
    });

    document.getElementById('clearMidiBtn').addEventListener('click', () => {
      scrollMidiBlocks = [];
      loopNotes = [];
      scrollRecordedEvents = [];
      sessionStartTime = null;
      updateExportCounter();
      showToast('Cleared MIDI Piano Roll');
    });

    exportBtn.addEventListener('click', exportStandardMidiFile);

    function drawPolygon(x, y, radius, sides, rotation = 0) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = rotation + (i * 2 * Math.PI) / sides;
        const px = x + Math.cos(a) * radius;
        const py = y + Math.sin(a) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function animate(now) {
      const dt = Math.min(64, now - lastFrameTime);
      lastFrameTime = now;

      ctx.clearRect(0, 0, width, height);

      const {
        rollTop, rollBottom, rollHeight,
        laneCount, laneH, keyWidth,
        rollLeft, rollRight, gridWidth
      } = getPianoRollGeometry();

      const arenaBottom = rollTop - 12;

      // --- 0. ADVANCE 4-BAR LOOP PLAYHEAD & RE-TRIGGER RECORDED NOTES ---
      if (rollMode === 'loop' && loopPlaying) {
        const prevProgress = loopProgress;
        const loopDurMs = getLoopDurationMs();
        loopProgress = (loopProgress + dt / loopDurMs) % 1.0;

        for (const n of loopNotes) {
          const crossedNormal = prevProgress < n.normStart && loopProgress >= n.normStart;
          const crossedWrap = loopProgress < prevProgress && (n.normStart > prevProgress || n.normStart <= loopProgress);

          if (crossedNormal || crossedWrap) {
            n.flash = 1.0;
            fireInstrumentLane(n.lane, n.velocity, null, false);
          }
        }
      }

      // --- 1. UPDATE & DRAW KINETIC ORBS ---
      for (const m of movers) {
        const prevX = m.x;
        const prevY = m.y;

        m.x += m.vx;
        m.y += m.vy;

        if (m.x < m.r + 14) { m.x = m.r + 14; m.vx = Math.abs(m.vx); }
        if (m.x > width - m.r - 14) { m.x = width - m.r - 14; m.vx = -Math.abs(m.vx); }
        if (m.y < m.r + 68) { m.y = m.r + 68; m.vy = Math.abs(m.vy); }
        if (m.y > arenaBottom - m.r) { m.y = arenaBottom - m.r; m.vy = -Math.abs(m.vy); }

        const orbSpeedNorm = Math.min(1, Math.hypot(m.vx, m.vy) / 5.8);

        for (const s of strings) {
          if (checkLineCross(s.y, prevY, m.y, m.x, s.x1, s.x2)) {
            pluckString(s, m.x, orbSpeedNorm);
          }
        }

        for (const d of drums) {
          const dist = Math.hypot(m.x - d.x, m.y - d.y);
          const inRange = dist <= d.r + m.r;
          if (inRange && !m.drumCooldowns[d.id]) {
            hitDrum(d, orbSpeedNorm);
            m.drumCooldowns[d.id] = true;
            const nx = (m.x - d.x) / (dist || 1);
            const ny = (m.y - d.y) / (dist || 1);
            const speed = Math.hypot(m.vx, m.vy);
            m.vx = nx * speed;
            m.vy = ny * speed;
          } else if (!inRange) {
            m.drumCooldowns[d.id] = false;
          }
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.restore();
      }

      // --- 2. DRAW GUITAR STRINGS ---
      for (const s of strings) {
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath();
        ctx.arc(s.x1, s.y, 3.5, 0, Math.PI * 2);
        ctx.arc(s.x2, s.y, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y);
        if (s.amp > 0.1) {
          s.phase += 0.65;
          s.amp *= 0.925;
          const controlX = s.pluckX || (s.x1 + s.x2) / 2;
          const offsetY = Math.sin(s.phase) * s.amp;
          ctx.quadraticCurveTo(controlX, s.y + offsetY, s.x2, s.y);
          ctx.strokeStyle = s.color;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 14;
          ctx.lineWidth = 2.8;
        } else {
          s.amp = 0;
          ctx.lineTo(s.x2, s.y);
          ctx.strokeStyle = 'rgba(226, 232, 240, 0.25)';
          ctx.lineWidth = 1.6;
        }
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = 'rgba(226, 232, 240, 0.6)';
        ctx.font = '11px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(s.name, s.x1 - 12, s.y + 4);

        ctx.fillStyle = 'rgba(226, 232, 240, 0.26)';
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`M${s.midi}`, s.x2 + 10, s.y + 3);
      }

      // --- 3. DRAW GEOMETRIC DRUM PADS ---
      for (const d of drums) {
        if (d.pulse > 0.01) d.pulse *= 0.88;
        else d.pulse = 0;

        const r = d.r + d.pulse * 11;
        ctx.save();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 2.2 + d.pulse * 2.2;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + d.pulse * 0.16})`;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = d.pulse * 24;

        if (d.shape === 'triangle') drawPolygon(d.x, d.y, r, 3, -Math.PI / 2);
        else if (d.shape === 'diamond') drawPolygon(d.x, d.y, r, 4, 0);
        else drawPolygon(d.x, d.y, r, 6, Math.PI / 6);

        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(226, 232, 240, 0.68)';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.fullLabel, d.x, d.y + 1);
        ctx.fillStyle = 'rgba(226, 232, 240, 0.34)';
        ctx.font = '9px monospace';
        ctx.fillText(`MIDI ${d.midi}`, d.x, d.y + 13);
        ctx.restore();
      }

      // --- 4. DRAW PLUCK RIPPLES & MULTI-TOUCH TRAILS ---
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 1.9;
        rp.alpha *= 0.91;
        ctx.save();
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = rp.color;
        ctx.globalAlpha = rp.alpha;
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();
        if (rp.alpha < 0.03) ripples.splice(i, 1);
      }

      for (let i = touchTrails.length - 1; i >= 0; i--) {
        const tr = touchTrails[i];
        tr.r *= 0.94;
        tr.alpha *= 0.86;
        ctx.save();
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${tr.alpha})`;
        ctx.fill();
        ctx.restore();
        if (tr.alpha < 0.04) touchTrails.splice(i, 1);
      }

      // --- 5. DRAW BOTTOM 9-LANE MIDI PIANO ROLL ---
      ctx.fillStyle = '#0e1117';
      ctx.fillRect(20, rollTop, width - 40, rollHeight);

      for (let i = 0; i < laneCount; i++) {
        const ly = rollTop + i * laneH;
        const laneInfo = allLanes[i];

        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.016)' : 'rgba(0,0,0,0.22)';
        ctx.fillRect(rollLeft, ly, gridWidth, laneH);

        ctx.strokeStyle = i === 6 ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.05)';
        ctx.lineWidth = i === 6 ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(20, ly);
        ctx.lineTo(rollRight, ly);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(20, ly, keyWidth, laneH);

        ctx.fillStyle = laneInfo.color;
        ctx.fillRect(20, ly + 2, 4, laneH - 4);

        ctx.fillStyle = 'rgba(226, 232, 240, 0.8)';
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(laneInfo.label, 30, ly + laneH * 0.67);
      }

      // Vertical Beat & Bar Grid Lines (16 beats / 4 bars)
      for (let step = 1; step < 16; step++) {
        const gx = rollLeft + (step / 16) * gridWidth;
        const isBar = step % 4 === 0;
        ctx.strokeStyle = isBar ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.045)';
        ctx.lineWidth = isBar ? 1.2 : 1;
        ctx.beginPath();
        ctx.moveTo(gx, rollTop);
        ctx.lineTo(gx, rollBottom);
        ctx.stroke();

        if (isBar && rollMode === 'loop') {
          ctx.fillStyle = 'rgba(226, 232, 240, 0.3)';
          ctx.font = '9px monospace';
          ctx.fillText(`BAR ${step / 4 + 1}`, gx + 4, rollTop + 10);
        }
      }

      if (rollMode === 'loop') {
        ctx.fillStyle = 'rgba(226, 232, 240, 0.3)';
        ctx.font = '9px monospace';
        ctx.fillText('BAR 1', rollLeft + 4, rollTop + 10);

        for (const n of loopNotes) {
          if (n.flash > 0.01) n.flash *= 0.9;
          else n.flash = 0;

          const nx = rollLeft + n.normStart * gridWidth;
          const nw = Math.max(8, n.normDur * gridWidth);
          const ny = rollTop + n.lane * laneH + 2;
          const nh = laneH - 4;

          ctx.save();
          ctx.fillStyle = n.color;
          ctx.shadowColor = n.color;
          ctx.shadowBlur = 6 + n.flash * 14;
          ctx.beginPath();
          ctx.roundRect(nx, ny, nw, nh, 3);
          ctx.fill();

          if (n.flash > 0.1) {
            ctx.fillStyle = `rgba(255,255,255,${n.flash * 0.55})`;
            ctx.fill();
          }

          const velRatio = n.velocity / 127;
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(11, 13, 16, 0.5)';
          ctx.fillRect(nx + 2, ny + nh - 3, Math.max(0, nw - 4) * velRatio, 2);
          ctx.restore();
        }

        // Sweeping Loop Playhead
        const loopPlayheadX = rollLeft + loopProgress * gridWidth;
        ctx.save();
        ctx.strokeStyle = '#a855f7';
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(loopPlayheadX, rollTop);
        ctx.lineTo(loopPlayheadX, rollBottom);
        ctx.stroke();
        ctx.restore();
      } else {
        const scrollPlayheadX = rollRight - 48;

        for (let i = scrollMidiBlocks.length - 1; i >= 0; i--) {
          const b = scrollMidiBlocks[i];
          b.x -= 1.85;

          const by = rollTop + b.lane * laneH + 2;
          const bh = laneH - 4;

          if (b.x < rollLeft + 30) {
            b.alpha = Math.max(0, (b.x - rollLeft) / 30);
          }

          if (b.x + b.w > rollLeft) {
            const drawX = Math.max(rollLeft, b.x);
            const drawW = Math.min(b.w, b.x + b.w - rollLeft);

            ctx.save();
            ctx.globalAlpha = b.alpha;
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.roundRect(drawX, by, drawW, bh, 3);
            ctx.fill();

            const velRatio = b.velocity / 127;
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(11, 13, 16, 0.45)';
            ctx.fillRect(drawX + 2, by + bh - 3, Math.max(0, drawW - 4) * velRatio, 2);
            ctx.restore();
          }

          if (b.x + b.w < rollLeft) {
            scrollMidiBlocks.splice(i, 1);
          }
        }

        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(scrollPlayheadX, rollTop);
        ctx.lineTo(scrollPlayheadX, rollBottom);
        ctx.stroke();
        ctx.restore();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      ctx.strokeRect(20, rollTop, width - 40, rollHeight);
      ctx.beginPath();
      ctx.moveTo(rollLeft, rollTop);
      ctx.lineTo(rollLeft, rollBottom);
      ctx.stroke();

      requestAnimationFrame(animate);
    }

    window.onload = function () {
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
